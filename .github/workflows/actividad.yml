name: Actualizar gráfico de actividad

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actividad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/actividad.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/actividad.svg
          git diff --cached --quiet || (git commit -m "Actualizar gráfico de actividad" && git push)
