<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d"/>
      <stop offset="40%" stop-color="#0b1424"/>
      <stop offset="75%" stop-color="#1a0d24"/>
      <stop offset="100%" stop-color="#05050d"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D91023"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#D91023"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D91023" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D91023" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveFlow1 {
      0%, 100% { d: path("M 0,160 Q 300,120 600,160 T 1200,160 L 1200,240 L 0,240 Z"); }
      50% { d: path("M 0,150 Q 300,180 600,140 T 1200,150 L 1200,240 L 0,240 Z"); }
    }
    @keyframes waveFlow2 {
      0%, 100% { d: path("M 0,180 Q 300,150 600,190 T 1200,170 L 1200,240 L 0,240 Z"); }
      50% { d: path("M 0,170 Q 300,200 600,160 T 1200,185 L 1200,240 L 0,240 Z"); }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(1100px); opacity: 0; } }
    .wave1 { animation: waveFlow1 8s ease-in-out infinite; }
    .wave2 { animation: waveFlow2 6s ease-in-out infinite; }
    .led { animation: blink 1.6s ease-in-out infinite; }
    .pkt { animation: packet 7s linear infinite; }
    .title-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 52px; font-weight: 900; letter-spacing: 6px; fill: #ffffff; text-anchor: middle;
      filter: drop-shadow(0 0 16px rgba(0, 245, 212, 0.7));
    }
    .subtitle-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px; font-weight: 600; letter-spacing: 2px; fill: #00F5D4; text-anchor: middle;
      filter: drop-shadow(0 0 8px rgba(0, 245, 212, 0.4));
    }
    .tag-text {
      font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #94A3B8; text-anchor: middle; letter-spacing: 1px;
    }
    .grid-line { stroke: rgba(56, 189, 248, 0.08); stroke-width: 1; }
  </style>

  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)"/>

  <g>
    <line x1="100" y1="0" x2="100" y2="240" class="grid-line"/><line x1="200" y1="0" x2="200" y2="240" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="240" class="grid-line"/><line x1="400" y1="0" x2="400" y2="240" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="240" class="grid-line"/><line x1="600" y1="0" x2="600" y2="240" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="240" class="grid-line"/><line x1="800" y1="0" x2="800" y2="240" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="240" class="grid-line"/><line x1="1000" y1="0" x2="1000" y2="240" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="240" class="grid-line"/>
    <line x1="0" y1="40" x2="1200" y2="40" class="grid-line"/><line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line"/><line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line"/>
  </g>

  <!-- Paquete de red viajando -->
  <circle class="pkt" cx="50" cy="40" r="3" fill="#00F5D4" filter="url(#glow)"/>

  <!-- LEDs tipo switch -->
  <g transform="translate(60,64)">
    <circle class="led" cx="0" cy="0" r="4" fill="#22C55E"/>
    <circle class="led" cx="14" cy="0" r="4" fill="#22C55E" style="animation-delay:.4s"/>
    <circle class="led" cx="28" cy="0" r="4" fill="#F59E0B" style="animation-delay:.8s"/>
  </g>
  <g transform="translate(1112,64)">
    <circle class="led" cx="0" cy="0" r="4" fill="#F59E0B" style="animation-delay:.2s"/>
    <circle class="led" cx="14" cy="0" r="4" fill="#22C55E" style="animation-delay:.6s"/>
    <circle class="led" cx="28" cy="0" r="4" fill="#22C55E" style="animation-delay:1s"/>
  </g>

  <path class="wave1" fill="url(#waveGrad1)" d="M 0,160 Q 300,120 600,160 T 1200,160 L 1200,240 L 0,240 Z"/>
  <path class="wave2" fill="url(#waveGrad2)" d="M 0,180 Q 300,150 600,190 T 1200,170 L 1200,240 L 0,240 Z"/>

  <rect x="0" y="0" width="1200" height="4" fill="url(#neonBar)" filter="url(#glow)"/>

  <text x="600" y="92" class="title-text">YOTO_IA</text>
  <text x="600" y="132" class="subtitle-text">⚡ INGENIERÍA DE SISTEMAS • DEV FULL-STACK • REDES • IA • IoT ⚡</text>
  <text x="600" y="160" class="tag-text">&lt;/&gt; Building technology from Peru 🇵🇪</text>

  <path d="M 20,20 L 45,20 M 20,20 L 20,45" stroke="#00F5D4" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1180,20 L 1155,20 M 1180,20 L 1180,45" stroke="#D91023" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 20,220 L 45,220 M 20,220 L 20,195" stroke="#D91023" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1180,220 L 1155,220 M 1180,220 L 1180,195" stroke="#00F5D4" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
